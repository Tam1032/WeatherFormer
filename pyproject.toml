[project]
name = "weatherformer"
version = "0.2.0"
description = "Qwen2-7B + LoRA that learns to call a real weather API (Toolformer), served with vLLM + FastAPI"
requires-python = ">=3.11,<3.13"
# Core deps: weatherformer/{tools,parser,agent}.py, shared by every group
dependencies = ["httpx==0.28.1"]

[dependency-groups]
api = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
]
ui = [
    "gradio==6.30.0",
    "requests==2.34.2",
]
# Fine-tuning, merge, AWQ quantization, HF baseline benchmark
train = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "peft==0.21.2",
    "bitsandbytes==0.50.2",
    "accelerate==1.15.0",
    "datasets==5.1.0",
    "llmcompressor==0.14.0.1",
    "requests==2.34.2",
]
# vLLM outside Docker (step 3)
serve = ["vllm==0.32.0"]
dev = [
    { include-group = "api" },
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.2",
]

[tool.uv]
default-groups = []
# vllm 0.32.0 pins torch==2.13.0, the training stack uses torch==2.14.0
conflicts = [[{ group = "train" }, { group = "serve" }]]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weatherformer"]

[tool.ruff]
line-length = 120
extend-exclude = [
    "weatherformer/legacy_hf.py",
    "weatherformer/legacy_utils.py",
    "create_datasets.py",
    "filter_toolformer_qwen.py",
    "finetune_qwen2_peft.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["weatherformer", "api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
