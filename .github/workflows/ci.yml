name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --group dev ruff check .
      - run: uv run --frozen --group dev pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t weatherformer-api .
      - run: docker build -f ui/Dockerfile -t weatherformer-ui .
